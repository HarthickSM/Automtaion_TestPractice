# ---------------------------------------------------------------------------
# Framework configuration. Every value can be overridden at runtime with a
# system property, e.g.  mvn test -Dbrowser=firefox -Dheadless=false
# ---------------------------------------------------------------------------
base.url=https://testautomationpractice.blogspot.com/
browser=chrome
headless=true
# local | remote (Selenium Grid)
run.mode=local
grid.url=http://localhost:4444/wd/hub
window.maximize=true

# timeouts (seconds)
implicit.wait=0
explicit.wait=20
page.load.timeout=60
script.timeout=30
polling.interval.millis=250

# reporting
report.name=ExtentReport.html
report.title=TestAutomationPractice Automation Report
screenshot.on.failure=true
screenshot.on.pass=false

# retry failed tests n times before marking them failed
retry.count=1

# self healing locators: fall back to alternative locators, then to a similarity match against the
# last known good element fingerprint (test-output/healing/locator-repository.json)
self.healing=true
self.healing.min.score=0.6
